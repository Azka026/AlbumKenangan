<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Kenangan Keluarga</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Style kustom untuk slider foto */
    .slider-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      border-radius: 0.5rem;
    }
    .slider-track {
      display: flex;
      transition: transform 0.3s ease-in-out;
      width: 100%;
    }
    .slide-img {
      min-width: 100%;
      max-height: 450px;
      object-fit: contain;
      background-color: #000;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400 flex items-center gap-2">
        <i class="fa-solid font-camera"></i> Album Kenangan
      </h1>
      <button id="adminBtn" onclick="toggleAdminMode()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm transition font-medium border border-slate-600 flex items-center gap-2">
        <i class="fa-solid fa-lock"></i> <span id="adminBtnText">Mode Admin</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Panel Tambah Data (Mode Admin Only) -->
    <div id="adminPanel" class="hidden bg-slate-800 border border-amber-500/30 p-6 rounded-xl mb-8 shadow-lg">
      <h2 class="text-lg font-semibold text-amber-400 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle"></i> Tambah Kenangan Baru
      </h2>
      <form id="uploadForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Judul Kenangan</label>
            <input type="text" id="inputJudul" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Tanggal</label>
            <input type="date" id="inputTanggal" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 focus:outline-none">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Lokasi</label>
            <input type="text" id="inputLokasi" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Usia / Momen</label>
            <input type="text" id="inputUsia" placeholder="misal: 5 Tahun" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Cerita / Catatan</label>
          <textarea id="inputCerita" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 focus:outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Pilih Foto Utama</label>
          <input type="file" id="inputFile" accept="image/*" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-400">
        </div>
        <button type="submit" id="btnSubmit" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold px-6 py-2.5 rounded-lg text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Kenangan
        </button>
      </form>
    </div>

    <!-- Grid Kenangan -->
    <div id="loading" class="text-center py-12 text-slate-400">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-400 mb-2"></i>
      <p>Memuat kenangan indah...</p>
    </div>

    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Modal Detail & Slider Foto -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl z-10">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- Slider Container -->
      <div class="slider-container bg-black mb-4 group">
        <div id="sliderTrack" class="slider-track"></div>
        
        <!-- Navigation Buttons -->
        <button id="prevBtn" onclick="moveSlide(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white p-2 rounded-full hidden">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button id="nextBtn" onclick="moveSlide(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white p-2 rounded-full hidden">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Indikator Slide/Dots -->
      <div id="slideDots" class="flex justify-center gap-2 mb-4"></div>

      <!-- Tombol Tambah Foto (Admin Only) -->
      <div id="addPhotoContainer" class="hidden mb-4 p-3 bg-slate-900/50 rounded-lg border border-slate-700">
        <label class="block text-xs text-amber-400 font-medium mb-1">+ Tambah Foto Lagi ke Momen Ini</label>
        <div class="flex gap-2">
          <input type="file" id="addPhotoInput" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:bg-slate-700 file:text-slate-200">
          <button onclick="uploadAdditionalPhoto()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 text-xs px-3 py-1 rounded font-semibold transition">Unggah</button>
        </div>
      </div>

      <!-- Info Detail -->
      <h3 id="modalTitle" class="text-xl font-bold text-amber-400 mb-2"></h3>
      <div class="flex flex-wrap gap-4 text-xs text-slate-400 mb-4 border-b border-slate-700 pb-3">
        <span id="modalDate"><i class="fa-regular fa-calendar"></i> -</span>
        <span id="modalLocation"><i class="fa-solid fa-location-dot"></i> -</span>
        <span id="modalAge"><i class="fa-solid fa-user"></i> -</span>
      </div>
      <p id="modalStory" class="text-slate-300 text-sm whitespace-pre-line leading-relaxed"></p>

      <!-- Action Footer (Admin) -->
      <div id="modalAdminActions" class="hidden mt-6 pt-4 border-t border-slate-700 flex justify-end">
        <button id="btnDelete" onclick="deleteCurrentItem()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 px-4 py-2 rounded-lg text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-trash"></i> Hapus Momen Ini
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logika -->
  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Vib5srs0rsTCmlQRqoc6LJYQAcdsGLQJVRQeqrkynew/gviz/tq?tqx=out:csv';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby4EiH2AxOYaGX3DDpri-3Fhw_VG8LW54Kz9b7PHJQOxNGr4mheifOE7dO8ECytzRkybw/exec';
    const ADMIN_PASSWORD = "azka23";

    let memoriesData = [];
    let isAdmin = false;
    let currentSlideIndex = 0;
    let currentPhotoList = [];
    let activeMemoryId = null;

    // Turn Google Drive link to Direct View Image Link
    function getDirectImgUrl(driveUrlOrId) {
      if(!driveUrlOrId) return 'https://via.placeholder.com/400x300?text=No+Image';
      let id = driveUrlOrId;
      if(driveUrlOrId.includes('id=')){
        id = driveUrlOrId.split('id=')[1].split('&')[0];
      } else if(driveUrlOrId.includes('/d/')){
        id = driveUrlOrId.split('/d/')[1].split('/')[0];
      }
      return `https://lh3.googleusercontent.com/d/${id}`;
    }

    // Load CSV Data
    async function fetchMemories() {
      try {
        const res = await fetch(SHEET_CSV_URL + '&timestamp=' + new Date().getTime());
        const text = await res.text();
        memoriesData = parseCSV(text);
        renderCards();
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = '<p class="text-red-400">Gagal memuat data kenangan.</p>';
      }
    }

    function parseCSV(text) {
      const lines = text.split('\n').filter(l => l.trim() !== '');
      const results = [];
      for (let i = 1; i < lines.length; i++) {
        const matches = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
        if (matches) {
          const row = matches.map(val => val.replace(/^"|"$/g, '').replace(/""/g, '"'));
          results.push({
            id: row[0] || '',
            tanggal: row[1] || '',
            judul: row[2] || '',
            cerita: row[3] || '',
            lokasi: row[4] || '',
            usia: row[5] || '',
            fileUrl: row[6] || '',
            fileIds: row[7] ? row[7].split(',') : [row[6]]
          });
        }
      }
      return results.reverse();
    }

    function renderCards() {
      document.getElementById('loading').classList.add('hidden');
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      if (memoriesData.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-8">Belum ada kenangan tersimpan.</p>';
        return;
      }

      memoriesData.forEach(item => {
        const firstPhotoId = item.fileIds[0] || item.fileUrl;
        const mainImgUrl = getDirectImgUrl(firstPhotoId);
        const totalPhotos = item.fileIds.length;

        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700/60 rounded-xl overflow-hidden shadow-lg hover:border-amber-500/50 transition cursor-pointer flex flex-col';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <div class="relative h-48 bg-slate-900 overflow-hidden">
            <img src="${mainImgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${item.judul}">
            ${totalPhotos > 1 ? `<span class="absolute top-2 right-2 bg-black/70 text-amber-400 text-xs px-2 py-1 rounded-md font-semibold"><i class="fa-solid fa-images"></i> ${totalPhotos} Foto</span>` : ''}
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-xs text-amber-400 font-medium">${item.tanggal}</span>
              <h3 class="text-base font-semibold text-slate-100 mt-1 line-clamp-1">${item.judul}</h3>
              <p class="text-xs text-slate-400 mt-2 line-clamp-2">${item.cerita}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between text-xs text-slate-500">
              <span><i class="fa-solid fa-location-dot"></i> ${item.lokasi || '-'}</span>
              <span><i class="fa-solid fa-user"></i> ${item.usia || '-'}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal & Slider Logic
    function openModal(item) {
      activeMemoryId = item.id;
      currentPhotoList = item.fileIds;
      currentSlideIndex = 0;

      document.getElementById('modalTitle').innerText = item.judul;
      document.getElementById('modalDate').innerHTML = `<i class="fa-regular fa-calendar"></i> ${item.tanggal}`;
      document.getElementById('modalLocation').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${item.lokasi || '-'}`;
      document.getElementById('modalAge').innerHTML = `<i class="fa-solid fa-user"></i> ${item.usia || '-'}`;
      document.getElementById('modalStory').innerText = item.cerita;

      buildSlider();

      // Show Admin Extras if logged in
      if (isAdmin) {
        document.getElementById('addPhotoContainer').classList.remove('hidden');
        document.getElementById('modalAdminActions').classList.remove('hidden');
      } else {
        document.getElementById('addPhotoContainer').classList.add('hidden');
        document.getElementById('modalAdminActions').classList.add('hidden');
      }

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function buildSlider() {
      const track = document.getElementById('sliderTrack');
      const dots = document.getElementById('slideDots');
      track.innerHTML = '';
      dots.innerHTML = '';

      currentPhotoList.forEach((photoId, idx) => {
        const img = document.createElement('img');
        img.src = getDirectImgUrl(photoId);
        img.className = 'slide-img';
        track.appendChild(img);

        const dot = document.createElement('button');
        dot.className = `w-2.5 h-2.5 rounded-full transition ${idx === 0 ? 'bg-amber-400' : 'bg-slate-600'}`;
        dot.onclick = () => goToSlide(idx);
        dots.appendChild(dot);
      });

      // Toggle Nav Buttons
      if (currentPhotoList.length > 1) {
        document.getElementById('prevBtn').classList.remove('hidden');
        document.getElementById('nextBtn').classList.remove('hidden');
        document.getElementById('slideDots').classList.remove('hidden');
      } else {
        document.getElementById('prevBtn').classList.add('hidden');
        document.getElementById('nextBtn').classList.add('hidden');
        document.getElementById('slideDots').classList.add('hidden');
      }

      updateSlidePosition();
    }

    function moveSlide(direction) {
      currentSlideIndex += direction;
      if (currentSlideIndex < 0) currentSlideIndex = currentPhotoList.length - 1;
      if (currentSlideIndex >= currentPhotoList.length) currentSlideIndex = 0;
      updateSlidePosition();
    }

    function goToSlide(index) {
      currentSlideIndex = index;
      updateSlidePosition();
    }

    function updateSlidePosition() {
      const track = document.getElementById('sliderTrack');
      track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;

      // Update dots style
      const dots = document.getElementById('slideDots').children;
      for (let i = 0; i < dots.length; i++) {
        if (i === currentSlideIndex) {
          dots[i].className = 'w-2.5 h-2.5 rounded-full transition bg-amber-400 scale-125';
        } else {
          dots[i].className = 'w-2.5 h-2.5 rounded-full transition bg-slate-600';
        }
      }
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    // Toggle Admin
    function toggleAdminMode() {
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtnText').innerText = "Mode Admin";
        document.getElementById('adminPanel').classList.add('hidden');
      } else {
        const pwd = prompt("Masukkan Password Admin:");
        if (pwd === ADMIN_PASSWORD) {
          isAdmin = true;
          document.getElementById('adminBtnText').innerText = "Keluar Admin";
          document.getElementById('adminPanel').classList.remove('hidden');
        } else if (pwd !== null) {
          alert("Password Salah!");
        }
      }
    }

    // Form Submit (Simpan Kenangan Baru)
    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengunggah...';

      const fileInput = document.getElementById('inputFile').files[0];
      const reader = new FileReader();

      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        const payload = {
          action: 'saveData',
          judul: document.getElementById('inputJudul').value,
          tanggal: document.getElementById('inputTanggal').value,
          lokasi: document.getElementById('inputLokasi').value,
          usia: document.getElementById('inputUsia').value,
          cerita: document.getElementById('inputCerita').value,
          fileName: fileInput.name,
          mimeType: fileInput.type,
          fileData: base64Data
        };

        try {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          alert("Berhasil disimpan! Memperbarui data...");
          document.getElementById('uploadForm').reset();
          setTimeout(fetchMemories, 3000);
        } catch (err) {
          alert("Terjadi kesalahan saat mengunggah.");
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Simpan Kenangan';
        }
      };

      reader.readAsDataURL(fileInput);
    }

    // Tambah Foto Tambahan (Admin Only)
    async function uploadAdditionalPhoto() {
      const fileInput = document.getElementById('addPhotoInput').files[0];
      if (!fileInput) return alert("Pilih foto terlebih dahulu!");

      const reader = new FileReader();
      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        const payload = {
          action: 'addPhoto',
          id: activeMemoryId,
          fileName: fileInput.name,
          mimeType: fileInput.type,
          fileData: base64Data
        };

        try {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          alert("Foto berhasil ditambahkan! Memperbarui...");
          closeModal();
          setTimeout(fetchMemories, 3000);
        } catch (err) {
          alert("Gagal menambahkan foto.");
        }
      };

      reader.readAsDataURL(fileInput);
    }

    // Hapus Momen (Admin Only)
    async function deleteCurrentItem() {
      if (!confirm("Apakah Anda yakin ingin menghapus kenangan ini?")) return;

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: activeMemoryId })
        });

        alert("Kenangan dihapus! Memperbarui...");
        closeModal();
        setTimeout(fetchMemories, 3000);
      } catch (err) {
        alert("Gagal menghapus.");
      }
    }

    // Initial Load
    fetchMemories();
  </script>
</body>
</html>
