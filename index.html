    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Vib5srs0rsTCmlQRqoc6LJYQAcdsGLQJVRQeqrkynew/gviz/tq?tqx=out:csv';
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxAc2XiVdAZN2ZpegrSVXczx00WwATgpc5tSn71vdEeOpT6X02qwh8hyndEZIS5YLen/exec';
        const ADMIN_PASSWORD = "azka23";

        let calculatedUsiaText = "";
        let targetCardIdForAdd = null;
        let currentImageGroup = [];
        let currentImageIndex = 0;
        let isModalOpen = false;

        let childrenData = JSON.parse(localStorage.getItem('children_data')) || [
            { id: '1', name: 'Muhammad Azka Salim', parents: '', dob: '' }
        ];
        let activeChildId = localStorage.getItem('active_child_id') || childrenData[0].id;

        window.onload = function() {
            renderChildDropdowns();
            loadCurrentChildProfile();
            if (localStorage.getItem('is_admin_logged_in') === 'true') {
                showAdminUI(true);
            }
            loadAlbum();
        };

        window.onpopstate = function() { if (isModalOpen) closeModalUI(); };
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && isModalOpen) closeModalDirect(); });

        function toggleAdminMode() {
            const currentStatus = localStorage.getItem('is_admin_logged_in') === 'true';
            if (!currentStatus) {
                let pwd = prompt("Masukkan password admin:");
                if (pwd === ADMIN_PASSWORD) {
                    localStorage.setItem('is_admin_logged_in', 'true');
                    showAdminUI(true);
                    alert("Mode Admin Berhasil Aktif! ✨");
                } else if (pwd !== null) {
                    alert("Password Salah!");
                }
            } else {
                localStorage.setItem('is_admin_logged_in', 'false');
                showAdminUI(false);
                alert("Keluar dari Mode Admin.");
            }
            loadAlbum();
        }

        function showAdminUI(show) {
            const panel = document.getElementById('adminPanel');
            const btn = document.getElementById('adminBtn');
            if (show) {
                panel.style.display = 'block';
                btn.innerText = "🔓 Keluar Admin";
                btn.style.background = "rgba(255, 255, 255, 0.4)";
            } else {
                panel.style.display = 'none';
                btn.innerText = "🔒 Admin";
                btn.style.background = "rgba(255, 255, 255, 0.25)";
            }
        }

        function openModalGroup(fileIdsStr, startIndex) {
            const ids = fileIdsStr.split(',').map(s => s.trim()).filter(Boolean);
            currentImageGroup = ids.map(id => id.includes('http') ? id : `https://lh3.googleusercontent.com/d/${id}`);
            currentImageIndex = startIndex;
            updateModalView();
            document.getElementById('imageModal').style.display = 'flex';
            if (!isModalOpen) { isModalOpen = true; history.pushState({ modalOpen: true }, ""); }
        }

        function closeModalDirect() { if (isModalOpen) history.back(); }
        function closeModalUI() { document.getElementById('imageModal').style.display = 'none'; isModalOpen = false; }

        function updateModalView() {
            const img = document.getElementById('modalImg');
            img.src = currentImageGroup[currentImageIndex];
            const prevBtn = document.getElementById('btnPrev');
            const nextBtn = document.getElementById('btnNext');
            const counter = document.getElementById('modalCounter');

            if (currentImageGroup.length > 1) {
                prevBtn.style.display = 'block'; nextBtn.style.display = 'block'; counter.style.display = 'block';
                counter.innerText = `${currentImageIndex + 1} / ${currentImageGroup.length}`;
            } else {
                prevBtn.style.display = 'none'; nextBtn.style.display = 'none'; counter.style.display = 'none';
            }
        }

        function prevImage(e) { if(e) e.stopPropagation(); currentImageIndex = (currentImageIndex > 0) ? currentImageIndex - 1 : currentImageGroup.length - 1; updateModalView(); }
        function nextImage(e) { if(e) e.stopPropagation(); currentImageIndex = (currentImageIndex < currentImageGroup.length - 1) ? currentImageIndex + 1 : 0; updateModalView(); }

        function renderChildDropdowns() {
            const frontSelect = document.getElementById('selectChildFront');
            const adminSelect = document.getElementById('selectChildAdmin');
            if (!frontSelect || !adminSelect) return;
            frontSelect.innerHTML = ''; adminSelect.innerHTML = '';

            childrenData.forEach(child => {
                const opt1 = document.createElement('option'); opt1.value = child.id; opt1.innerText = child.name || 'Si Kecil';
                if (child.id === activeChildId) opt1.selected = true;
                frontSelect.appendChild(opt1);

                const opt2 = document.createElement('option'); opt2.value = child.id; opt2.innerText = child.name || 'Si Kecil';
                if (child.id === activeChildId) opt2.selected = true;
                adminSelect.appendChild(opt2);
            });
        }

        function addNewChild() {
            const name = prompt("Masukkan nama anak baru:");
            if (!name) return;
            const newChild = { id: Date.now().toString(), name: name, parents: '', dob: '' };
            childrenData.push(newChild);
            activeChildId = newChild.id;
            saveAllChildrenData();
            renderChildDropdowns();
            loadCurrentChildProfile();
        }

        function changeActiveChild(id) {
            activeChildId = id;
            localStorage.setItem('active_child_id', activeChildId);
            renderChildDropdowns();
            loadCurrentChildProfile();
        }

        function saveAllChildrenData() {
            localStorage.setItem('children_data', JSON.stringify(childrenData));
        }

        function loadCurrentChildProfile() {
            const child = childrenData.find(c => c.id === activeChildId) || childrenData[0];
            if (!child) return;
            document.getElementById('childName').value = child.name || '';
            document.getElementById('childParents').value = child.parents || '';
            document.getElementById('dob').value = child.dob || '';
            document.getElementById('childNameDisplay').innerText = child.name ? `👶 ${child.name}` : "👶 Si Kecil";
            document.getElementById('childParentsDisplay').innerText = child.parents ? `Putra/Putri dari: ${child.parents}` : "Buah hati tercinta";
            calculateAutoAge();
        }

        function saveCurrentChildProfile() {
            const childIndex = childrenData.findIndex(c => c.id === activeChildId);
            if (childIndex !== -1) {
                childrenData[childIndex].name = document.getElementById('childName').value;
                childrenData[childIndex].parents = document.getElementById('childParents').value;
                childrenData[childIndex].dob = document.getElementById('dob').value;
                saveAllChildrenData();
                loadCurrentChildProfile();
                loadAlbum();
            }
        }

        function calculateAutoAge() {
            const dob = document.getElementById('dob').value;
            const tglFoto = document.getElementById('tanggalFoto').value;
            if (!dob || !tglFoto) {
                document.getElementById('calculatedAge').innerText = "";
                calculatedUsiaText = "";
                return;
            }
            const birth = new Date(dob);
            const photoDate = new Date(tglFoto);
            if (photoDate < birth) {
                document.getElementById('calculatedAge').innerText = "⚠️ Tanggal foto sebelum tanggal lahir!";
                calculatedUsiaText = "Baru lahir";
                return;
            }
            let years = photoDate.getFullYear() - birth.getFullYear();
            let months = photoDate.getMonth() - birth.getMonth();
            let days = photoDate.getDate() - birth.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(photoDate.getFullYear(), photoDate.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            let text = "";
            if (years > 0) text += `${years} Tahun `;
            if (months > 0) text += `${months} Bulan `;
            if (years === 0 && months === 0) text += `${days} Hari`;
            if (!text.trim()) text = "Baru lahir";

            calculatedUsiaText = text.trim();
            document.getElementById('calculatedAge').innerText = `✨ Usia saat foto: ${calculatedUsiaText}`;
            document.getElementById('usia').value = calculatedUsiaText;
        }

        function detectPhotoDate(input) {
            const file = input.files[0];
            if (!file) return;
            
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('tanggalFoto').value = todayStr;
            calculateAutoAge();

            EXIF.getData(file, function() {
                const dateTaken = EXIF.getTag(this, "DateTimeOriginal");
                if (dateTaken) {
                    const parts = dateTaken.split("[: ]");
                    if (parts.length >= 3) {
                        const formatted = `${parts[0]}-${parts[1]}-${parts[2]}`;
                        document.getElementById('tanggalFoto').value = formatted;
                        document.getElementById('exifNotice').innerText = "✅ Tanggal foto terdeteksi otomatis dari EXIF!";
                        calculateAutoAge();
                    }
                }
            });
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "📤 Mengunggah ke Spreadsheet...";
            btn.disabled = true;

            const fileInput = document.getElementById('fotoFile');
            const file = fileInput.files[0];

            try {
                const base64Data = await getBase64(file);
                const payload = {
                    action: 'saveData',
                    tanggal: document.getElementById('tanggalFoto').value,
                    judul: document.getElementById('judul').value,
                    cerita: document.getElementById('cerita').value,
                    lokasi: document.getElementById('lokasi').value,
                    usia: document.getElementById('usia').value || calculatedUsiaText,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                alert("Berhasil! Momen tersimpan ke Spreadsheet.");
                document.getElementById('uploadForm').reset();
                document.getElementById('exifNotice').innerText = "";
                document.getElementById('calculatedAge').innerText = "";
                setTimeout(loadAlbum, 3000);
            } catch (err) {
                alert("Gagal mengunggah: " + err);
            } finally {
                btn.innerText = "📤 Simpan ke Album";
                btn.disabled = false;
            }
        }

        async function deleteItem(id) {
            if (!confirm("Yakin ingin menghapus momen ini?")) return;
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });
                alert("Momen berhasil dihapus!");
                setTimeout(loadAlbum, 3000);
            } catch (err) {
                alert("Gagal menghapus: " + err);
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(l => l.trim() !== '');
            const results = [];
            for (let i = 0; i < lines.length; i++) {
                const matches = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if (matches) {
                    results.push(matches.map(val => val.replace(/^"|"$/g, '').replace(/""/g, '"')));
                }
            }
            return results;
        }

        async function loadAlbum() {
            const container = document.getElementById('album-list');
            container.innerHTML = '<div class="status-msg">Memuat album kenangan... ✨</div>';

            try {
                const response = await fetch(SHEET_CSV_URL + '&t=' + new Date().getTime());
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length <= 1) {
                    container.innerHTML = '<div class="status-msg">Belum ada kenangan tersimpan di spreadsheet. Yuk tambah momen baru! 🌟</div>';
                    return;
                }

                let html = '';
                const isLoggedIn = localStorage.getItem('is_admin_logged_in') === 'true';

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 3) continue;

                    const id = row[0] || "";
                    const tanggal = row[1] || "";
                    const judul = row[2] || "";
                    const cerita = row[3] || "";
                    const lokasi = row[4] || "";
                    const usia = row[5] || "";
                    const fileFoto = row[6] || "";
                    const fileIds = row[7] || "";

                    if (!judul) continue;

                    let allIdsToDisplay = fileIds ? fileIds : fileFoto;
                    let photoArray = allIdsToDisplay.split(',').map(s => s.trim()).filter(Boolean);

                    html += `
                        <div class="card">
                            <div class="photo-gallery-grid">
                    `;

                    photoArray.forEach((photoId, idx) => {
                        let imageUrl = photoId.includes('http') ? photoId : `https://lh3.googleusercontent.com/d/${photoId}`;
                        html += `
                            <div class="card-img-container" onclick="openModalGroup('${allIdsToDisplay}', ${idx})">
                                <img src="${imageUrl}" class="card-img" loading="lazy" alt="${judul}">
                            </div>
                        `;
                    });

                    html += `
                            </div>
                            <div class="card-body">
                                <div class="meta-info">
                                    <span>📅 ${tanggal}</span>
                                    ${usia ? `<span>• 👶 Usia: ${usia}</span>` : ''}
                                </div>
                                <h3 class="card-title">${judul}</h3>
                                ${cerita ? `<p class="card-story">${cerita}</p>` : ''}
                                <div class="card-footer">
                                    <span class="location-tag">${lokasi ? `📍 ${lokasi}` : ''}</span>
                                </div>
                                ${isLoggedIn ? `
                                    <div class="admin-action-box" style="display: block;">
                                        <button class="admin-delete-btn" onclick="deleteItem('${id}')">🗑️ Hapus Momen Ini</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html || '<div class="status-msg">Belum ada kenangan tersimpan.</div>';

            } catch (err) {
                container.innerHTML = `<div class="status-msg" style="color: #e53e3e;">Gagal memuat data dari Spreadsheet: ${err}</div>`;
            }
        }
    </script>
