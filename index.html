<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Kenangan Si Kecil 👶✨</title>
    
    <!-- Meta Tags PWA -->
    <meta name="theme-color" content="#3182ce">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Album Kecil">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2922/2922506.png">

    <!-- Memanggil File Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Library EXIF JS -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
        :root {
            --primary: #3182ce;
            --primary-gradient: linear-gradient(135deg, #2b6cb0 0%, #4299e1 100%);
            --secondary: #319795;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 20px 15px 90px 15px; 
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 750px; margin: 0 auto; }
        
        header { 
            text-align: center; 
            padding: 35px 20px; 
            background: var(--primary-gradient); 
            color: white;
            border-radius: var(--radius); 
            margin-bottom: 20px; 
            box-shadow: 0 10px 25px rgba(49, 130, 206, 0.25); 
            position: relative; 
        }

        header h1 { font-size: 1.8em; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        header p { font-size: 0.95em; opacity: 0.9; font-weight: 400; }
        
        .child-info-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .child-info-card h2 { font-size: 1.4em; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .child-info-card p { font-size: 0.9em; color: var(--text-muted); line-height: 1.5; }

        .child-select-front {
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e0;
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text-main);
            background: #f8fafc;
            width: 100%;
            max-width: 300px;
        }

        .admin-toggle-btn { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4); 
            padding: 6px 14px; 
            border-radius: 30px; 
            font-size: 0.75em; 
            cursor: pointer; 
            color: white; 
            font-weight: 600; 
            transition: all 0.2s;
        }
        .admin-toggle-btn:hover { background: rgba(255, 255, 255, 0.4); }

        .admin-only { display: none; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-section { 
            background: #fff; 
            border: 1px solid #edf2f7; 
            padding: 20px; 
            border-radius: var(--radius); 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .profile-section h4 { font-size: 1em; color: var(--primary); margin-bottom: 15px; font-weight: 700; }
        .profile-section label { font-size: 0.8em; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .profile-section input, .profile-section select { 
            padding: 10px 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px; 
            font-size: 0.9em; 
            width: 100%; 
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .btn-add-child {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85em;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
        }

        .upload-section { 
            background: #fff; 
            padding: 25px; 
            border-radius: var(--radius); 
            margin-bottom: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            border: 1px solid #edf2f7; 
        }
        .upload-section h3 { margin-bottom: 20px; color: var(--text-main); font-size: 1.2em; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85em; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 0.95em; 
            font-family: inherit;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
        .form-group textarea { resize: vertical; height: 90px; }
        
        .auto-age-preview { font-size: 0.85em; color: #d69e2e; font-weight: 700; margin-top: 6px; display: block; }
        .exif-info { font-size: 0.8em; color: #38a169; font-weight: 700; margin-top: 6px; display: block; }
        
        .btn-submit { 
            background: var(--primary-gradient); 
            color: #fff; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 12px; 
            font-weight: 700; 
            width: 100%; 
            cursor: pointer; 
            font-size: 1em; 
            box-shadow: 0 6px 20px rgba(49, 130, 206, 0.35);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #cbd5e0; box-shadow: none; cursor: not-allowed; }

        .section-title { font-size: 1.3em; color: var(--text-main); margin-bottom: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        
        .card { 
            background: var(--card-bg); 
            border-radius: var(--radius); 
            overflow: hidden; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            border: 1px solid rgba(0,0,0,0.04);
        }
        
        /* Grid Layout Jika Banyak Foto */
        .photo-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 6px;
            background: #e2e8f0;
            padding: 4px;
        }

        .card-img-container {
            width: 100%;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            height: 220px;
        }

        .single-photo .card-img-container {
            height: auto;
            max-height: 550px;
        }

        .card-img { 
            width: 100%; 
            height: 100%;
            object-fit: cover; 
            display: block; 
            transition: transform 0.3s ease;
        }

        .single-photo .card-img {
            object-fit: contain;
        }
        
        .card-img-container:hover .card-img { transform: scale(1.03); }

        .card-body { padding: 22px; }
        
        .meta-info { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            font-size: 0.8em; 
            color: #2b6cb0; 
            background: #ebf8ff;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700; 
            margin-bottom: 14px; 
            align-items: center;
            border: 1px solid #bee3f8;
        }

        .card-title { font-size: 1.25em; color: var(--text-main); margin-bottom: 10px; font-weight: 700; letter-spacing: -0.3px; }
        .card-story { line-height: 1.7; color: var(--text-muted); font-size: 0.95em; margin-bottom: 20px; white-space: pre-line; }
        
        .card-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid #edf2f7; 
            padding-top: 15px; 
        }
        
        .location-tag { font-size: 0.85em; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        
        .admin-delete-btn { 
            display: none; 
            background: #fff5f5; 
            color: #e53e3e; 
            border: 1px solid #feb2b2; 
            padding: 8px 14px; 
            border-radius: 10px; 
            font-size: 0.8em; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%;
        }

        .status-msg { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 500; }

        /* MODAL FULLSCREEN */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
        }

        .pwa-install-banner {
            display: none;
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid #e2e8f0;
            z-index: 9998;
            align-items: center;
            justify-content: space-between;
        }

        .btn-pwa-install {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8em;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="admin-toggle-btn" onclick="toggleAdminMode()" id="adminBtn">🔒 Admin</button>
            <h1>Album Kenangan Si Kecil 👶✨</h1>
            <p>Jurnal tumbuh kembang dan momen berharga penuh cinta</p>
        </header>

        <div class="child-info-card">
            <h2 id="childNameDisplay">👶 Si Kecil</h2>
            <p id="childParentsDisplay">Buah hati tercinta</p>
            
            <label for="selectChildFront" style="font-size: 0.8em; color: var(--text-muted); display: block; margin-top: 12px; font-weight: 600;">PILIH ANGGOTA KELUARGA / ANAK:</label>
            <select id="selectChildFront" class="child-select-front" onchange="changeActiveChild(this.value)"></select>
        </div>

        <div id="adminPanel" class="admin-only">
            <div class="profile-section">
                <h4>⚙️ Kelola Profil Anak (Admin)</h4>
                <button class="btn-add-child" onclick="addNewChild()">➕ Tambah Anak Baru</button>

                <label for="selectChildAdmin">Pilih Anak yang Diubah:</label>
                <select id="selectChildAdmin" onchange="changeActiveChild(this.value)"></select>

                <label for="childName">Nama Anak:</label>
                <input type="text" id="childName" placeholder="Contoh: Muhammad Azka" onchange="saveCurrentChildProfile()">

                <label for="childParents">Putra/Putri Dari (Pasangan):</label>
                <input type="text" id="childParents" placeholder="Contoh: Pasangan Budi & Siti" onchange="saveCurrentChildProfile()">

                <label for="dob">🎂 Tanggal Lahir Anak:</label>
                <input type="date" id="dob" onchange="saveCurrentChildProfile()">
            </div>

            <div class="upload-section">
                <h3>➕ Tambah Kenangan Baru</h3>
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Pilih Foto Original (Bisa Pilih Beberapa Foto):</label>
                        <input type="file" id="fotoFile" accept="image/*" multiple onchange="detectPhotoDate(this)" required>
                        <span id="exifNotice" class="exif-info"></span>
                    </div>
                    <div class="form-group">
                        <label>Judul Momen:</label>
                        <input type="text" id="judul" placeholder="Contoh: Jalan-jalan ke Kebun Binatang" required>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Momen Foto Taken:</label>
                        <input type="date" id="tanggalFoto" onchange="calculateAutoAge()" required>
                        <span id="calculatedAge" class="auto-age-preview"></span>
                    </div>
                    <div class="form-group">
                        <label>Lokasi (Opsional):</label>
                        <input type="text" id="lokasi" placeholder="Contoh: Taman Kota / Ancol">
                    </div>
                    <div class="form-group">
                        <label>Cerita Kenangan:</label>
                        <textarea id="cerita" placeholder="Tuliskan cerita lengkap kenangan manis ini..."></textarea>
                    </div>
                    <button type="submit" id="btnSubmit" class="btn-submit">📤 Simpan ke Album</button>
                </form>
            </div>
        </div>

        <h3 class="section-title">📸 Galeri Kenangan</h3>
        <div id="album-list" class="status-msg">Memuat album kenangan... ✨</div>
    </div>

    <div id="imageModal" class="image-modal" onclick="closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <!-- BANNER PWA -->
    <div id="pwaBanner" class="pwa-install-banner">
        <div>
            <h5 style="font-size:0.9em;">Album Si Kecil</h5>
            <p style="font-size:0.75em; color:#718096;">Pasang di layar utama HP Anda</p>
        </div>
        <button class="btn-pwa-install" onclick="installApp()">Jadikan Aplikasi</button>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Vib5srs0rsTCmlQRqoc6LJYQAcdsGLQJVRQeqrkynew/gviz/tq?tqx=out:csv';
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzeZyME0o4ronjhw9TPjQXWW2N28QiNZC54CxOnST1GAvCVTNqxjSDjgbrPWNIc4PUq/exec';
        const ADMIN_PASSWORD = "azka23";

        let calculatedUsiaText = "";
        let deferredPrompt = null;

        let childrenData = JSON.parse(localStorage.getItem('children_data')) || [
            { id: '1', name: 'Si Kecil', parents: '', dob: '' }
        ];
        let activeChildId = localStorage.getItem('active_child_id') || childrenData[0].id;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Gagal:', err));
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!localStorage.getItem('pwa_banner_dismissed')) {
                document.getElementById('pwaBanner').style.display = 'flex';
            }
        });

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                document.getElementById('pwaBanner').style.display = 'none';
            }
        }

        window.onload = function() {
            renderChildDropdowns();
            loadCurrentChildProfile();

            if (localStorage.getItem('is_admin_logged_in') === 'true') {
                showAdminUI(true);
            }
            loadAlbum();
        };

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            document.getElementById('modalImg').src = imgSrc;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function renderChildDropdowns() {
            const frontSelect = document.getElementById('selectChildFront');
            const adminSelect = document.getElementById('selectChildAdmin');
            frontSelect.innerHTML = '';
            adminSelect.innerHTML = '';

            childrenData.forEach(child => {
                const opt1 = document.createElement('option');
                opt1.value = child.id;
                opt1.innerText = child.name || 'Si Kecil';
                if (child.id === activeChildId) opt1.selected = true;
                frontSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = child.id;
                opt2.innerText = child.name || 'Si Kecil';
                if (child.id === activeChildId) opt2.selected = true;
                adminSelect.appendChild(opt2);
            });
        }

        function addNewChild() {
            const name = prompt("Masukkan nama anak baru:");
            if (!name) return;
            const newChild = { id: Date.now().toString(), name: name, parents: '', dob: '' };
            childrenData.push(newChild);
            activeChildId = newChild.id;
            saveAllChildrenData();
            renderChildDropdowns();
            loadCurrentChildProfile();
        }

        function changeActiveChild(id) {
            activeChildId = id;
            localStorage.setItem('active_child_id', activeChildId);
            renderChildDropdowns();
            loadCurrentChildProfile();
        }

        function loadCurrentChildProfile() {
            const child = childrenData.find(c => c.id === activeChildId) || childrenData[0];
            document.getElementById('childName').value = child.name || '';
            document.getElementById('childParents').value = child.parents || '';
            document.getElementById('dob').value = child.dob || '';
            document.getElementById('childNameDisplay').innerText = child.name ? `👶 ${child.name}` : "👶 Si Kecil";
            document.getElementById('childParentsDisplay').innerText = child.parents ? `Putra/Putri dari: ${child.parents}` : "Buah hati tercinta";
            calculateAutoAge();
        }

        function saveCurrentChildProfile() {
            const childIndex = childrenData.findIndex(c => c.id === activeChildId);
            if (childIndex !== -1) {
                childrenData[childIndex].name = document.getElementById('childName').value;
                childrenData[childIndex].parents = document.getElementById('childParents').value;
                childrenData[childIndex].dob = document.getElementById('dob').value;
                saveAllChildrenData();
                renderChildDropdowns();
                loadCurrentChildProfile();
            }
        }

        function saveAllChildrenData() {
            localStorage.setItem('children_data', JSON.stringify(childrenData));
            localStorage.setItem('active_child_id', activeChildId);
        }

        function showAdminUI(isLoggedIn) {
            const adminPanel = document.getElementById('adminPanel');
            const adminBtn = document.getElementById('adminBtn');
            const deleteButtons = document.querySelectorAll('.admin-delete-btn');

            if (isLoggedIn) {
                adminPanel.style.display = 'block';
                adminBtn.innerText = '🔓 Keluar Admin';
                deleteButtons.forEach(btn => btn.style.display = 'block');
            } else {
                adminPanel.style.display = 'none';
                adminBtn.innerText = '🔒 Admin';
                deleteButtons.forEach(btn => btn.style.display = 'none');
            }
        }

        function toggleAdminMode() {
            if (localStorage.getItem('is_admin_logged_in') === 'true') {
                localStorage.setItem('is_admin_logged_in', 'false');
                showAdminUI(false);
            } else {
                const inputPassword = prompt("Masukkan Password Admin:");
                if (inputPassword === ADMIN_PASSWORD) {
                    localStorage.setItem('is_admin_logged_in', 'true');
                    showAdminUI(true);
                } else if (inputPassword !== null) {
                    alert("Password salah!");
                }
            }
        }

        function detectPhotoDate(input) {
            const files = input.files;
            const exifNotice = document.getElementById('exifNotice');
            const tanggalFotoInput = document.getElementById('tanggalFoto');

            if (!files || files.length === 0) return;

            exifNotice.innerText = `🔍 Membaca tanggal dari ${files.length} foto...`;

            EXIF.getData(files[0], function() {
                const dateTime = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
                if (dateTime) {
                    const parts = dateTime.split(" ")[0].split(":");
                    if (parts.length === 3) {
                        tanggalFotoInput.value = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                        exifNotice.innerText = `✨ (${files.length} Foto terpilih) Tanggal terdeteksi otomatis!`;
                        calculateAutoAge();
                        return;
                    }
                }
                if (files[0].lastModified) {
                    const fileDate = new Date(files[0].lastModified);
                    const year = fileDate.getFullYear();
                    const month = String(fileDate.getMonth() + 1).padStart(2, '0');
                    const day = String(fileDate.getDate()).padStart(2, '0');
                    tanggalFotoInput.value = `${year}-${month}-${day}`;
                    exifNotice.innerText = `ℹ️ (${files.length} Foto terpilih) Tanggal berdasarkan waktu simpan file.`;
                    calculateAutoAge();
                }
            });
        }

        function calculateAutoAge() {
            const dobInput = document.getElementById('dob').value;
            const photoDateInput = document.getElementById('tanggalFoto').value;
            const ageDisplay = document.getElementById('calculatedAge');

            if (!dobInput || !photoDateInput) {
                calculatedUsiaText = "";
                return;
            }

            const dob = new Date(dobInput);
            const photoDate = new Date(photoDateInput);

            let years = photoDate.getFullYear() - dob.getFullYear();
            let months = photoDate.getMonth() - dob.getMonth();
            let days = photoDate.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                const lastMonth = new Date(photoDate.getFullYear(), photoDate.getMonth(), 0);
                days += lastMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            let ageResult = [];
            if (years > 0) ageResult.push(years + " Tahun");
            if (months > 0) ageResult.push(months + " Bulan");
            if (days > 0 || (years === 0 && months === 0)) ageResult.push(days + " Hari");

            calculatedUsiaText = ageResult.join(" ");
            ageDisplay.innerText = "👶 Usia saat foto diambil: " + calculatedUsiaText;
        }

        function formatDateIndo(dateStr) {
            if(!dateStr) return "";
            const parts = dateStr.split('-');
            if(parts.length !== 3) return dateStr;
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]} ${parts[0]}`;
        }

        async function loadAlbum() {
            try {
                const response = await fetch(SHEET_CSV_URL + '&r=' + Math.random());
                const data = await response.text();
                const rows = parseCSV(data);
                const albumList = document.getElementById('album-list');
                albumList.innerHTML = '';

                let items = rows.slice(1);

                function parseIndoDate(dateStr) {
                    if (!dateStr) return new Date(0);
                    const months = { "Januari": 0, "Februari": 1, "Maret": 2, "April": 3, "Mei": 4, "Juni": 5, "Juli": 6, "Agustus": 7, "September": 8, "Oktober": 9, "November": 10, "Desember": 11 };
                    const parts = dateStr.trim().split(' ');
                    if (parts.length === 3) {
                        return new Date(parseInt(parts[2]), months[parts[1]] || 0, parseInt(parts[0]));
                    }
                    return new Date(dateStr);
                }

                items.sort((a, b) => parseIndoDate(b[1]) - parseIndoDate(a[1]));

                if (items.length === 0 || (items.length === 1 && items[0][0] === "")) {
                    albumList.innerHTML = '<div class="status-msg">Belum ada kenangan foto yang diunggah. ✨</div>';
                    return;
                }

                items.forEach(row => {
                    if (row.length < 8) return;
                    const [id, tanggal, judul, cerita, lokasi, usia, fileFoto, fileId] = row;
                    const cleanFileId = fileId ? fileId.trim() : '';
                    if (!cleanFileId) return;

                    const fileIds = cleanFileId.split(',').map(s => s.trim()).filter(Boolean);
                    const isAdmin = localStorage.getItem('is_admin_logged_in') === 'true';

                    let photosHtml = '';
                    const isMultiple = fileIds.length > 1;

                    if (isMultiple) {
                        photosHtml = `<div class="photo-gallery-grid">`;
                        fileIds.forEach(fId => {
                            const imgUrl = `https://lh3.googleusercontent.com/d/${fId}`;
                            photosHtml += `
                                <div class="card-img-container" onclick="openModal('${imgUrl}')">
                                    <img class="card-img" src="${imgUrl}" alt="${judul}" loading="lazy">
                                </div>
                            `;
                        });
                        photosHtml += `</div>`;
                    } else {
                        const imgUrl = `https://lh3.googleusercontent.com/d/${fileIds[0]}`;
                        photosHtml = `
                            <div class="single-photo">
                                <div class="card-img-container" onclick="openModal('${imgUrl}')">
                                    <img class="card-img" src="${imgUrl}" alt="${judul}" loading="lazy">
                                </div>
                            </div>
                        `;
                    }

                    albumList.innerHTML += `
                        <div class="card" id="card-${id}">
                            ${photosHtml}
                            <div class="card-body">
                                <div class="meta-info">
                                    ${tanggal ? `<span>📅 ${tanggal}</span>` : ''}
                                    ${usia ? `<span>• 👶 Usia: ${usia}</span>` : ''}
                                    ${fileIds.length > 1 ? `<span>• 🖼️ ${fileIds.length} Foto</span>` : ''}
                                </div>
                                <h2 class="card-title">${judul || 'Momen Berharga'}</h2>
                                <p class="card-story">${cerita || ''}</p>
                                <div class="card-footer">
                                    <span class="location-tag">${lokasi ? '📍 ' + lokasi : ''}</span>
                                </div>
                                <button class="admin-delete-btn" style="display: ${isAdmin ? 'block' : 'none'};" onclick="deletePhoto('${id}')">🗑️ Hapus Kenangan Ini</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('album-list').innerHTML = 'Gagal memuat album.';
            }
        }

        async function deletePhoto(id) {
            if (!confirm("Apakah Anda yakin ingin menghapus seluruh kenangan foto ini?")) return;
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "delete", id: id })
                });
                const data = await res.json();
                if (data.result === 'success') {
                    alert("🗑️ Berhasil dihapus!");
                    loadAlbum();
                } else {
                    alert("Gagal menghapus.");
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi.");
            }
        }

        function compressImage(file, maxWidth = 1200, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // PROSES UPLOAD MULTIPLE FOTO TERGABUNG DALAM 1 KENANGAN
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const fileInput = document.getElementById('fotoFile');
            const files = fileInput.files;

            if (!files || files.length === 0) return alert("Pilih minimal satu foto!");

            btn.disabled = true;

            try {
                const rawDate = document.getElementById('tanggalFoto').value;
                const formattedDate = formatDateIndo(rawDate);
                
                let uploadedFileIds = [];
                let firstBase64 = "";

                // 1. Loop kompresi dan upload foto satu per satu ke Drive
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `⏳ Memproses & Mengunggah foto (${i + 1} dari ${files.length})...`;
                    
                    // Kompres foto (Maksimal lebar 1200px agar ringan & cepat)
                    const base64Data = await compressImage(files[i], 1200, 0.7);

                    if (i === 0) firstBase64 = base64Data;

                    const uploadPayload = {
                        action: "uploadOnly",
                        fileName: files[i].name.replace(/\.[^/.]+$/, "") + ".jpg",
                        mimeType: "image/jpeg",
                        fileData: base64Data
                    };

                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(uploadPayload)
                    });

                    const resData = await response.json();
                    if (resData.result === 'success' && resData.fileId) {
                        uploadedFileIds.push(resData.fileId);
                    } else {
                        throw new Error("Gagal mengunggah foto ke-" + (i + 1));
                    }
                }

                // 2. Simpan 1 baris data kenangan ke Google Sheets yang berisi semua ID Foto
                btn.innerText = `💾 Menyimpan kenangan ke Google Sheets...`;

                const finalPayload = {
                    action: "saveData",
                    fileName: files[0].name,
                    mimeType: "image/jpeg",
                    fileData: firstBase64,
                    fileId: uploadedFileIds.join(','), // Gabungkan semua ID foto dipisah koma
                    judul: document.getElementById('judul').value,
                    tanggal: formattedDate,
                    usia: calculatedUsiaText,
                    lokasi: document.getElementById('lokasi').value,
                    cerita: document.getElementById('cerita').value
                };

                const finalResponse = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(finalPayload)
                });

                const finalData = await finalResponse.json();

                if (finalData.result === 'success') {
                    alert("🎉 Berhasil! " + files.length + " foto disimpan dalam 1 kenangan.");
                    document.getElementById('uploadForm').reset();
                    document.getElementById('calculatedAge').innerText = "";
                    document.getElementById('exifNotice').innerText = "";
                    loadAlbum();
                } else {
                    alert("Gagal menyimpan data ke Spreadsheet.");
                }

            } catch (err) {
                alert("Terjadi kesalahan saat mengunggah: " + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "📤 Simpan ke Album";
            }
        });

        function parseCSV(text) {
            let lines = text.split('\n');
            return lines.map(line => {
                let values = [], insideQuote = false, value = '';
                for (let char of line) {
                    if (char === '"') insideQuote = !insideQuote;
                    else if (char === ',' && !insideQuote) { values.push(value.trim()); value = ''; }
                    else value += char;
                }
                values.push(value.trim());
                return values;
            });
        }
    </script>
