<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Kenangan - Muhammad Azka Salim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <!-- Header dengan Nama Asli -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
                    📖 Album Kenangan
                </h1>
                <p class="text-xs text-indigo-600 font-semibold mt-0.5">Muhammad Azka Salim</p>
            </div>
            <button onclick="bukaAdmin()" id="btnAdmin" class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full font-medium transition hover:bg-slate-200">
                🔒 Admin
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Form Admin (Tersembunyi Awalnya) -->
        <section id="formAdmin" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 transition-all">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                ✨ Tambah Momen Baru
            </h2>
            <form id="formUpload" onsubmit="kirimData(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Kenangan</label>
                    <input type="text" id="judul" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
                        <input type="date" id="tanggal" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Usia Anak</label>
                        <input type="text" id="usia" placeholder="Contoh: 3 Tahun" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Lokasi</label>
                    <input type="text" id="lokasi" placeholder="Contoh: Rumah / Studio" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Cerita Momen</label>
                    <textarea id="cerita" rows="3" placeholder="Tuliskan cerita singkat..." class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Foto</label>
                    <input type="file" id="fileFoto" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2.5 rounded-xl transition shadow-sm">
                    Simpan Momen
                </button>
            </form>
        </section>

        <!-- Galeri -->
        <section>
            <div id="statusTeks" class="text-center py-12 text-slate-400 text-sm">
                Memuat kenangan...
            </div>
            <div id="wadahGaleri" class="space-y-6"></div>
        </section>
    </main>

    <!-- Script -->
    <script>
        const URL_API = 'https://script.google.com/macros/s/AKfycbxAc2XiVdAZN2ZpegrSVXczx00WwATgpc5tSn71vdEeOpT6X02qwh8hyndEZIS5YLen/exec';
        
        let statusAdmin = false;

        function bukaAdmin() {
            if (!statusAdmin) {
                let pwd = prompt("Masukkan password admin:");
                if (pwd === "admin123") {
                    statusAdmin = true;
                    document.getElementById('formAdmin').classList.remove('hidden');
                    document.getElementById('btnAdmin').innerText = "🔓 Keluar Admin";
                    document.getElementById('btnAdmin').className = "text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full font-medium transition";
                    alert("Mode Admin Berhasil Aktif!");
                } else if (pwd !== null) {
                    alert("Password Salah!");
                }
            } else {
                statusAdmin = false;
                document.getElementById('formAdmin').classList.add('hidden');
                document.getElementById('btnAdmin').innerText = "🔒 Admin";
                document.getElementById('btnAdmin').className = "text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full font-medium transition";
                alert("Keluar dari Mode Admin.");
            }
        }

        function ubahKeBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function kirimData(e) {
            e.preventDefault();
            const tombol = document.getElementById('btnSubmit');
            tombol.innerText = "Mengunggah... Mohon tunggu";
            tombol.disabled = true;

            const fileInput = document.getElementById('fileFoto');
            const file = fileInput.files[0];

            try {
                const base64Data = await ubahKeBase64(file);
                const dataKirim = {
                    action: 'saveData',
                    tanggal: document.getElementById('tanggal').value,
                    judul: document.getElementById('judul').value,
                    cerita: document.getElementById('cerita').value,
                    lokasi: document.getElementById('lokasi').value,
                    usia: document.getElementById('usia').value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                await fetch(URL_API, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dataKirim)
                });

                alert("Berhasil disimpan! Data akan masuk ke spreadsheet.");
                document.getElementById('formUpload').reset();
                setTimeout(() => location.reload(), 2000);
            } catch (err) {
                alert("Gagal: " + err);
                tombol.innerText = "Simpan Momen";
                tombol.disabled = false;
            }
        }

        window.onload = function() {
            document.getElementById('statusTeks').style.display = 'none';
            document.getElementById('wadahGaleri').innerHTML = `
                <div class="bg-white p-8 rounded-2xl text-center border border-slate-200 shadow-xs">
                    <p class="text-sm font-semibold text-slate-700 mb-1">Album Kenangan: Muhammad Azka Salim</p>
                    <p class="text-xs text-slate-400">Silakan klik tombol <b>Admin</b> di pojok kanan atas untuk menambah atau melihat foto momen.</p>
                </div>`;
        }
    </script>
</body>
</html>
