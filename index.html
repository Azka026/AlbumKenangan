<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Kenangan Kita ✨</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --primary-hover: #ff4757;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-main: #2f3542;
            --text-muted: #747d8c;
            --shadow: 0 10px 25px rgba(255, 107, 129, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            width: 100%;
            max-width: 800px;
        }

        header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2.2rem;
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 1rem;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.3);
            transition: background 0.2s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #747d8c;
            box-shadow: 0 4px 12px rgba(116, 125, 140, 0.3);
        }
        .btn-secondary:hover {
            background-color: #57606f;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 0 15px 50px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* Tata letak gambar */
        .card-img-container {
            width: 100%;
            max-height: 450px;
            overflow: hidden;
            background-color: #000;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }

        .card-img-container:hover .card-img {
            transform: scale(1.02);
        }

        /* Grid foto jika lebih dari 1 */
        .photo-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 4px;
            background-color: #fff;
            max-height: 350px;
            overflow-y: auto;
        }

        .photo-gallery-grid .card-img-container {
            height: 150px;
        }
        .photo-gallery-grid .card-img {
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .card-title {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .card-story {
            margin: 0 0 15px 0;
            font-size: 1rem;
            line-height: 1.6;
            color: #57606f;
            white-space: pre-line;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f2f6;
            padding-top: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .location-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Bagian Admin Aksi */
        .admin-action-box {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px dashed #dfe4ea;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-sub-btn {
            background-color: #f1f2f6;
            color: #2f3542;
            border: 1px solid #ced6e0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .admin-sub-btn:hover {
            background-color: #dfe4ea;
        }

        .admin-delete-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .admin-delete-btn:hover {
            background-color: #ff6b81;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 40px;
        }

        /* Modal / Pop-up Gambar Fullscreen */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #modalImage {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 24px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .modal-nav:hover { background: rgba(255, 255, 255, 0.4); }
        #modalPrev { left: 20px; }
        #modalNext { right: 20px; }

        /* Modal Form / Loading sederhana */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .popup-box {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .popup-box h3 { margin-top: 0; color: var(--primary-color); }
        .popup-box input, .popup-box textarea {
            width: 100%; padding: 10px; margin: 8px 0 15px 0;
            border: 1px solid #ced6e0; border-radius: 8px; box-sizing: border-box;
            font-family: inherit;
        }
        .popup-actions { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Album Kenangan Kita ✨</h1>
        <p>Kumpulan momen berharga yang diabadikan bersama</p>
        <div class="controls-bar" style="margin-top: 20px;">
            <button class="btn" onclick="window.location.href='form.html'">➕ Tambah Kenangan Baru</button>
            <button class="btn btn-secondary" id="adminToggleBtn" onclick="toggleAdminMode()">🔐 Mode Admin</button>
        </div>
    </header>

    <div class="container" id="album-list">
        <div class="status-msg">Memuat album kenangan... ✨</div>
    </div>

    <!-- Modal Lightbox Foto -->
    <div id="imageModal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <button class="modal-nav" id="modalPrev" onclick="event.stopPropagation(); changeModalSlide(-1)">&#10094;</button>
        <img id="modalImage" src="" alt="Zoom">
        <button class="modal-nav" id="modalNext" onclick="event.stopPropagation(); changeModalSlide(1)">&#10095;</button>
    </div>

    <!-- Modal Tambah Foto Susulan -->
    <div id="addPhotoModal" class="popup-overlay">
        <div class="popup-box">
            <h3>Tambah Foto ke Momen</h3>
            <p style="font-size: 0.9rem; color: #747d8c;">Pilih foto tambahan untuk momen ini:</p>
            <input type="file" id="additionalFileInput" accept="image/*">
            <div class="popup-actions">
                <button class="btn btn-secondary" onclick="closeAddPhotoModal()">Batal</button>
                <button class="btn" id="submitPhotoBtn" onclick="uploadAdditionalPhoto()">Unggah</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI URL (Sesuaikan milik Anda)
        // ==========================================
        const SPREADSHEET_ID = "1gM5S2Zg7c34VfQk28v9r7k8yX1pW0mN7fL4q3j2h1k0"; // Sesuaikan ID Spreadsheet Anda jika perlu
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQyX.../exec"; // Ganti dengan URL Web App Apps Script Anda
        const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;

        let currentModalImages = [];
        let currentModalIndex = 0;
        let selectedTargetIdForPhoto = "";

        document.addEventListener("DOMContentLoaded", () => {
            checkAdminStatus();
            loadAlbum();
        });

        // Toggle Mode Admin
        function toggleAdminMode() {
            const isAdmin = localStorage.getItem('is_admin_logged_in') === 'true';
            if (isAdmin) {
                localStorage.setItem('is_admin_logged_in', 'false');
                alert("Mode Admin dimatikan.");
                loadAlbum();
            } else {
                const pin = prompt("Masukkan PIN Admin:");
                if (pin === "1234") { // Ganti PIN sesuai keinginan Anda
                    localStorage.setItem('is_admin_logged_in', 'true');
                    alert("Mode Admin diaktifkan!");
                    loadAlbum();
                } else if (pin !== null) {
                    alert("PIN salah!");
                }
            }
            checkAdminStatus();
        }

        function checkAdminStatus() {
            const isAdmin = localStorage.getItem('is_admin_logged_in') === 'true';
            const btn = document.getElementById('adminToggleBtn');
            btn.innerText = isAdmin ? "🔓 Keluar Admin" : "🔐 Mode Admin";
            btn.style.backgroundColor = isAdmin ? "#2ed573" : "#747d8c";
        }

        // Fungsi parsing CSV standar
        function parseCSV(text) {
            let lines = text.split("\n");
            let result = [];
            let currentLine = [];
            let inQuotes = false;
            let value = "";

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        value += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentLine.push(value);
                    value = "";
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') { i++; }
                    currentLine.push(value);
                    result.push(currentLine);
                    currentLine = [];
                    value = "";
                } else {
                    value += char;
                }
            }
            if (value !== "" || currentLine.length > 0) {
                currentLine.push(value);
                result.push(currentLine);
            }
            return result;
        }

        function parseIndonesianDate(dateStr) {
            if (!dateStr) return new Date(0);
            const months = {
                'januari': 0, 'februari': 1, 'maret': 2, 'april': 3, 'mei': 4, 'juni': 5,
                'juli': 6, 'agustus': 7, 'september': 8, 'oktober': 9, 'november': 10, 'desember': 11
            };
            try {
                let parts = dateStr.toLowerCase().trim().split(' ');
                if (parts.length >= 3) {
                    let day = parseInt(parts[0]);
                    let month = months[parts[1]];
                    let year = parseInt(parts[2]);
                    if (!isNaN(day) && month !== undefined && !isNaN(year)) {
                        return new Date(year, month, day);
                    }
                }
            } catch (e) { }
            let d = new Date(dateStr);
            return isNaN(d.getTime()) ? new Date(0) : d;
        }

        // Memuat Album dari Spreadsheet
        async function loadAlbum() {
            const container = document.getElementById('album-list');
            container.className = 'status-msg';
            container.innerText = "Memuat album kenangan... ✨";

            try {
                const antiCacheUrl = SHEET_CSV_URL + '&t=' + new Date().getTime() + '&nocache=' + Math.random();
                const response = await fetch(antiCacheUrl);
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length <= 1) {
                    container.innerText = "Belum ada kenangan. Yuk tambah kenangan pertama! ✨";
                    return;
                }

                let items = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 3) continue;

                    const id = row[0] ? row[0].trim() : "";
                    const tanggal = row[1] ? row[1].trim() : "";
                    const judul = row[2] ? row[2].trim() : "";
                    if (!id || !judul) continue;

                    items.push({
                        id: id, tanggal: tanggal, judul: judul,
                        cerita: row[3] || "", lokasi: row[4] || "", usia: row[5] || "",
                        fileUrl: row[6] || "", fileIdsStr: row[7] || row[6] || "",
                        dateTime: parseIndonesianDate(tanggal)
                    });
                }

                items.sort((a, b) => b.dateTime - a.dateTime);

                if (items.length === 0) {
                    container.innerText = "Belum ada kenangan. Yuk tambah kenangan pertama! ✨";
                    return;
                }

                container.className = "";
                container.innerHTML = "";
                const isAdmin = localStorage.getItem('is_admin_logged_in') === 'true';

                items.forEach(item => {
                    const rawIds = item.fileIdsStr ? item.fileIdsStr.split(',') : [];
                    const ids = rawIds.map(s => s.trim()).filter(Boolean);

                    let galleryHtml = "";
                    if (ids.length === 1) {
                        const imgUrl = ids[0].includes('http') ? ids[0] : `https://lh3.googleusercontent.com/d/${ids[0]}`;
                        galleryHtml = `<div class="card-img-container" onclick="openModalGroup('${ids.join(',')}', 0)"><img src="${imgUrl}" class="card-img" alt="${item.judul}"></div>`;
                    } else if (ids.length > 1) {
                        let imgs = "";
                        ids.forEach((imgId, idx) => {
                            const imgUrl = imgId.includes('http') ? imgId : `https://lh3.googleusercontent.com/d/${imgId}`;
                            imgs += `<div class="card-img-container" onclick="openModalGroup('${ids.join(',')}', ${idx})"><img src="${imgUrl}" class="card-img" alt="${item.judul}"></div>`;
                        });
                        galleryHtml = `<div class="photo-gallery-grid">${imgs}</div>`;
                    }

                    const card = document.createElement('div');
                    card.id = `card-${item.id}`; // ID unik untuk DOM penghapusan instan
                    card.className = `card ${ids.length === 1 ? 'single-photo' : ''}`;
                    card.innerHTML = `
                        ${galleryHtml}
                        <div class="card-body">
                            <div class="meta-info">
                                <span>📅 ${item.tanggal}</span>
                                ${item.usia ? `<span>• 👶 ${item.usia}</span>` : ''}
                            </div>
                            <h3 class="card-title">${item.judul}</h3>
                            <p class="card-story">${item.cerita}</p>
                            <div class="card-footer">
                                <span class="location-tag">${item.lokasi ? `📍 ${item.lokasi}` : ''}</span>
                            </div>
                            <div class="admin-action-box" style="display: ${isAdmin ? 'flex' : 'none'};">
                                <button class="admin-sub-btn" onclick="triggerAddPhotos('${item.id}')">➕ Tambah Foto</button>
                                <button class="admin-delete-btn" onclick="deleteMemory('${item.id}')">🗑️ Hapus Kenangan</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                container.innerText = "Gagal memuat album. Periksa koneksi internet! ❌";
            }
        }

        // Fitur Hapus Kenangan dengan Penghapusan Elemen Instan
        async function deleteMemory(id) {
            if (!confirm("Yakin ingin menghapus kenangan ini?")) return;
            
            // Langsung sembunyikan kartu dari layar secara instan tanpa menunggu jeda server
            const cardElement = document.getElementById(`card-${id}`);
            if (cardElement) {
                cardElement.style.transition = 'all 0.4s ease';
                cardElement.style.opacity = '0';
                cardElement.style.transform = 'scale(0.9)';
                setTimeout(() => cardElement.remove(), 400);
            }

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });
            } catch (err) {
                console.error("Gagal mengirim perintah hapus:", err);
            }
        }

        // Modal Zoom Foto Group
        function openModalGroup(idsString, index) {
            currentModalImages = idsString.split(',').map(s => s.trim());
            currentModalIndex = index;
            updateModalImage();
            document.getElementById('imageModal').style.display = 'flex';
        }

        function updateModalImage() {
            const imgId = currentModalImages[currentModalIndex];
            const imgUrl = imgId.includes('http') ? imgId : `https://lh3.googleusercontent.com/d/${imgId}`;
            document.getElementById('modalImage').src = imgUrl;
            
            document.getElementById('modalPrev').style.display = currentModalImages.length > 1 ? 'block' : 'none';
            document.getElementById('modalNext').style.display = currentModalImages.length > 1 ? 'block' : 'none';
        }

        function changeModalSlide(direction) {
            currentModalIndex += direction;
            if (currentModalIndex < 0) currentModalIndex = currentModalImages.length - 1;
            if (currentModalIndex >= currentModalImages.length) currentModalIndex = 0;
            updateModalImage();
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Tambah Foto Susulan
        function triggerAddPhotos(id) {
            selectedTargetIdForPhoto = id;
            document.getElementById('additionalFileInput').value = "";
            document.getElementById('addPhotoModal').style.display = 'flex';
        }

        function closeAddPhotoModal() {
            document.getElementById('addPhotoModal').style.display = 'none';
        }

        async function uploadAdditionalPhoto() {
            const fileInput = document.getElementById('additionalFileInput');
            if (fileInput.files.length === 0) {
                alert("Pilih file foto terlebih dahulu!");
                return;
            }

            const file = fileInput.files[0];
            const btn = document.getElementById('submitPhotoBtn');
            btn.innerText = "Mengunggah...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(',')[1];
                const payload = {
                    action: 'addPhoto',
                    id: selectedTargetIdForPhoto,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    alert("Foto berhasil ditambahkan!");
                    closeAddPhotoModal();
                    setTimeout(() => loadAlbum(), 2000); // Tunggu sebentar lalu muat ulang album
                } catch (err) {
                    console.error(err);
                    alert("Gagal mengunggah foto.");
                } finally {
                    btn.innerText = "Unggah";
                    btn.disabled = false;
                }
            };
        }
    </script>
</body>
</html>
