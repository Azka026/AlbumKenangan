<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Kenangan Anak</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <!-- Header / Navigasi -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                📖 Album Kenangan
            </h1>
            <button onclick="toggleAdminMode()" id="adminBtn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full font-medium transition">
                🔒 Admin
            </button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Form Tambah Momen (Hanya tampil untuk Admin) -->
        <section id="adminFormSection" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 transition-all">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                ✨ Tambah Momen Baru
            </h2>
            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Kenangan</label>
                        <input type="text" id="judul" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
                        <input type="date" id="tanggal" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Lokasi</label>
                        <input type="text" id="lokasi" placeholder="Contoh: Rumah / Studio" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Usia Anak</label>
                        <input type="text" id="usia" placeholder="Contoh: 3 Tahun" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Cerita / Catatan Momen</label>
                    <textarea id="cerita" rows="3" placeholder="Tuliskan cerita singkat di balik foto ini..." class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Foto Utama</label>
                    <input type="file" id="fileFoto" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2.5 rounded-xl transition shadow-sm">
                    Simpan Momen
                </button>
            </form>
        </section>

        <!-- Daftar Galeri Momen -->
        <section>
            <div id="loadingState" class="text-center py-12 text-slate-400 text-sm">
                Memuat kenangan...
            </div>
            <div id="galleryContainer" class="space-y-6">
                <!-- Kartu momen dimuat otomatis -->
            </div>
        </section>
    </main>

    <!-- Modal Lightbox Foto Fullscreen -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <img id="lightboxImg" src="" class="max-w-full max-h-[90vh] object-contain rounded-lg">
    </div>

    <!-- Script Aplikasi -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxAc2XiVdAZN2ZpegrSVXczx00WwATgpc5tSn71vdEeOpT6X02qwh8hyndEZIS5YLen/exec';
        // Masukkan Spreadsheet ID Anda di sini untuk pembacaan galeri publik
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Vib5srs0rsTCmlQRqoc6LJYQAcdsGLQJVRQeqrkynew/gviz/tq?tqx=out:csv';
        
        let isAdmin = false;

        window.onload = function() {
            loadGallery();
            if (localStorage.getItem('isAdmin') === 'true') {
                enableAdminUI(true);
            }
        };

        function toggleAdminMode() {
            if (!isAdmin) {
                let pass = prompt("Masukkan password admin:");
                if (pass === "admin123") {
                    isAdmin = true;
                    localStorage.setItem('isAdmin', 'true');
                    enableAdminUI(true);
                    alert("Mode Admin Aktif!");
                } else if (pass !== null) {
                    alert("Password salah!");
                }
            } else {
                isAdmin = false;
                localStorage.setItem('isAdmin', 'false');
                enableAdminUI(false);
            }
            loadGallery();
        }

        function enableAdminUI(enable) {
            isAdmin = enable;
            const section = document.getElementById('adminFormSection');
            const btn = document.getElementById('adminBtn');
            if (enable) {
                section.classList.remove('hidden');
                btn.innerText = "🔓 Keluar Admin";
                btn.classList.add('bg-indigo-50', 'text-indigo-600');
            } else {
                section.classList.add('hidden');
                btn.innerText = "🔒 Admin";
                btn.classList.remove('bg-indigo-50', 'text-indigo-600');
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function handleUpload(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Mengunggah...";
            btn.disabled = true;

            const fileInput = document.getElementById('fileFoto');
            const file = fileInput.files[0];

            try {
                const base64Data = await getBase64(file);
                const payload = {
                    action: 'saveData',
                    tanggal: document.getElementById('tanggal').value,
                    judul: document.getElementById('judul').value,
                    cerita: document.getElementById('cerita').value,
                    lokasi: document.getElementById('lokasi').value,
                    usia: document.getElementById('usia').value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                alert("Momen berhasil disimpan! Data akan segera muncul.");
                document.getElementById('uploadForm').reset();
                setTimeout(loadGallery, 3000);
            } catch (err) {
                alert("Gagal mengunggah: " + err);
            } finally {
                btn.innerText = "Simpan Momen";
                btn.disabled = false;
            }
        }

        async function deleteItem(id) {
            if (!confirm("Yakin ingin menghapus momen ini?")) return;
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });
                alert("Momen dihapus!");
                setTimeout(loadGallery, 3000);
            } catch (err) {
                alert("Gagal menghapus: " + err);
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(l => l.trim() !== '');
            const results = [];
            for (let i = 0; i < lines.length; i++) {
                const matches = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                if (matches) {
                    results.push(matches.map(val => val.replace(/^"|"$/g, '').replace(/""/g, '"')));
                }
            }
            return results;
        }

        async function loadGallery() {
            const container = document.getElementById('galleryContainer');
            const loading = document.getElementById('loadingState');
            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                const response = await fetch(SHEET_CSV_URL + '&t=' + new Date().getTime());
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                loading.style.display = 'none';

                if (rows.length <= 1) {
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center border border-slate-200"><p class="text-sm text-slate-500">Belum ada kenangan tersimpan. Yuk tambah momen pertama!</p></div>`;
                    return;
                }

                let htmlContent = '';
                // Loop dari baris ke-1 (setelah header)
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 3) continue;

                    const id = row[0] || "";
                    const tanggal = row[1] || "";
                    const judul = row[2] || "";
                    const cerita = row[3] || "";
                    const lokasi = row[4] || "";
                    const usia = row[5] || "";
                    const fileUrl = row[6] || "";

                    if (!judul) continue;

                    htmlContent += `
                        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200">
                            ${fileUrl ? `<div class="h-64 sm:h-80 bg-slate-100 cursor-pointer overflow-hidden flex items-center justify-center" onclick="openLightbox('${fileUrl}')">
                                <img src="${fileUrl}" class="w-full h-full object-cover" alt="${judul}">
                            </div>` : ''}
                            <div class="p-5">
                                <div class="flex items-center gap-2 text-xs font-semibold text-indigo-600 mb-2">
                                    <span>📅 ${tanggal}</span>
                                    ${usia ? `<span>• 👶 ${usia}</span>` : ''}
                                </div>
                                <h3 class="text-lg font-bold text-slate-900 mb-2">${judul}</h3>
                                ${cerita ? `<p class="text-sm text-slate-600 mb-4 whitespace-pre-line leading-relaxed">${cerita}</p>` : ''}
                                <div class="flex justify-between items-center pt-3 border-t border-slate-100 text-xs text-slate-500">
                                    <span>${lokasi ? `📍 ${lokasi}` : ''}</span>
                                    ${isAdmin ? `<button onclick="deleteItem('${id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg font-semibold transition">🗑️ Hapus</button>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = htmlContent || `<div class="bg-white p-8 rounded-2xl text-center border border-slate-200"><p class="text-sm text-slate-500">Belum ada kenangan tersimpan.</p></div>`;

            } catch (err) {
                loading.style.display = 'none';
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center border border-slate-200"><p class="text-sm text-rose-500">Gagal memuat galeri kenangan.</p></div>`;
            }
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }
    </script>
</body>
</html>
