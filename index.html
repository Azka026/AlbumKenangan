<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Foto dengan Fitur Download & Navigasi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      padding: 30px 20px;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    /* Grid Galeri Foto */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      background: #fff;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .gallery-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    /* Modal / Tampilan View Foto */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      position: relative;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      max-width: 90%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .modal-content img {
      max-width: 100%;
      max-height: 65vh;
      border-radius: 8px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    /* Tombol-Tombol Aksi */
    .action-area {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-download {
      background-color: #28a745;
      color: #ffffff;
    }

    .btn-download:hover {
      background-color: #218838;
    }

    .btn-nav {
      background-color: #007bff;
      color: #ffffff;
    }

    .btn-nav:hover {
      background-color: #0056b3;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <h2>Galeri Foto Interaktif</h2>
  <p class="subtitle">Klik pada foto untuk membuka tampilan detail dan mengunduhnya satu per satu.</p>

  <!-- Daftar Galeri Foto -->
  <div class="gallery-container">
    <div class="gallery-item" onclick="openModal(0)">
      <img src="https://picsum.photos/id/1018/1000/700" alt="Foto 1 - Pemandangan Gunung">
    </div>
    <div class="gallery-item" onclick="openModal(1)">
      <img src="https://picsum.photos/id/1015/1000/700" alt="Foto 2 - Lembah Hijau">
    </div>
    <div class="gallery-item" onclick="openModal(2)">
      <img src="https://picsum.photos/id/1019/1000/700" alt="Foto 3 - Pantai & Laut">
    </div>
    <div class="gallery-item" onclick="openModal(3)">
      <img src="https://picsum.photos/id/1039/1000/700" alt="Foto 4 - Hutan Pinus">
    </div>
  </div>

  <!-- Tampilan View Foto (Modal) -->
  <div id="photoModal" class="modal" onclick="closeModalOnOuterClick(event)">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      
      <!-- Display Foto -->
      <img id="modalImage" src="" alt="View Foto Detail">
      
      <!-- Area Tombol Aksi -->
      <div class="action-area">
        <button class="btn btn-nav" onclick="changeImage(-1)">&#10094; Sebelumnya</button>
        
        <!-- Tombol Download Foto -->
        <a id="downloadBtn" href="" download="foto-pilihan.jpg" class="btn btn-download">
          Download Foto Ini
        </a>

        <button class="btn btn-nav" onclick="changeImage(1)">Selanjutnya &#10095;</button>
      </div>
    </div>
  </div>

  <script>
    // Menyimpan daftar URL foto dari galeri
    const images = Array.from(document.querySelectorAll('.gallery-item img')).map(img => img.src);
    let currentIndex = 0;

    // Buka Modal & Tampilkan Foto yang Diklik
    function openModal(index) {
      currentIndex = index;
      updateModalContent();
      document.getElementById('photoModal').style.display = 'flex';
    }

    // Perbarui Foto dan Link Download di dalam Modal
    function updateModalContent() {
      const currentSrc = images[currentIndex];
      document.getElementById('modalImage').src = currentSrc;
      
      // Update tautan download sesuai foto yang sedang aktif
      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.href = currentSrc;
      downloadBtn.setAttribute('download', `foto-${currentIndex + 1}.jpg`);
    }

    // Pindah Ke Foto Sebelum/Sesudah
    function changeImage(direction) {
      currentIndex += direction;
      
      // Loop kembali jika batas tercapai
      if (currentIndex < 0) {
        currentIndex = images.length - 1;
      } else if (currentIndex >= images.length) {
        currentIndex = 0;
      }
      
      updateModalContent();
    }

    // Tutup Modal
    function closeModal() {
      document.getElementById('photoModal').style.display = 'none';
    }

    // Tutup Modal jika area luar diklik
    function closeModalOnOuterClick(event) {
      if (event.target.id === 'photoModal') {
        closeModal();
      }
    }

    // Navigasi Keyboard (Panah Kiri, Kanan, dan Tombol Esc)
    document.addEventListener('keydown', function(event) {
      const modal = document.getElementById('photoModal');
      if (modal.style.display === 'flex') {
        if (event.key === 'ArrowLeft') {
          changeImage(-1);
        } else if (event.key === 'ArrowRight') {
          changeImage(1);
        } else if (event.key === 'Escape') {
          closeModal();
        }
      }
    });
  </script>

</body>
</html>
